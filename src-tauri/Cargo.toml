[package]
name = "reciter"
version = "0.14.2"
description = "Reciter - local-first English vocabulary learning client"
authors = ["Reciter"]
edition = "2021"

[lib]
name = "reciter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
